# One-command local stack: MongoDB + API (+ the Vite dev server runs on your host).
#   docker compose up --build
#   cd frontend && npm install && npm run dev   ->  http://localhost:5173
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      MONGODB_URI: mongodb://mongo:27017
      DATA_SOURCE: ${DATA_SOURCE:-open-meteo}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      CONTACT_EMAIL: ${CONTACT_EMAIL:-dev@example.com}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
